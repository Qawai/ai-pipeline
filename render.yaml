services:
  - type: web
    name: ai-pipeline
    runtime: python
    pythonVersion: "3.11"
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      curl -fsSL -o /tmp/oc.tar.gz https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-x64.tar.gz &&
      mkdir -p /tmp/oc && tar -xzf /tmp/oc.tar.gz -C /tmp/oc &&
      find /tmp/oc -name opencode -type f -exec cp {} /usr/local/bin/opencode \; &&
      chmod +x /usr/local/bin/opencode && rm -rf /tmp/oc /tmp/oc.tar.gz
    startCommand: python server.py
    envVars:
      - key: PORT
        value: "10000"
      # Ключ провайдера бесплатных моделей (например, OpenRouter).
      # Значение вставь в дашборде Render (Environment → Secret Files / Env), не сюда.
      - key: OPENROUTER_API_KEY

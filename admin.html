<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Pipeline — Админка</title>
<style>
  :root{--bg:#0c0e14;--panel:#131722;--line:#222838;--fg:#d7dce8;--mut:#8a93a8;--acc:#6ea8fe;--bad:#ff6b6b;--ok:#5fd38a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  .wrap{padding:18px 20px;max-width:1100px;margin:0 auto}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  input[type=text]{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:8px 10px;border-radius:8px;font:inherit;min-width:320px}
  button{background:var(--acc);color:#06101f;border:0;padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  button:active{transform:translateY(1px)}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
  .stat b{display:block;font-size:20px;color:var(--acc)}
  .stat span{color:var(--mut);font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
  th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--bg)}
  td.ip{color:var(--ok)}
  .empty{color:var(--mut);padding:24px 0;text-align:center}
  .err{color:var(--bad);padding:12px 0}
  a{color:var(--acc)}
  .ua{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>AI PIPELINE · АДМИНКА ПОСЕТИТЕЛЕЙ</h1>
  <span style="color:var(--mut)">данные с Cloudflare Worker</span>
</header>
<div class="wrap">
  <div class="row">
    <button id="load">Загрузить</button>
    <button id="refresh" class="ghost">Авто 15с</button>
    <a class="ghost" style="margin-left:auto" href="./">← к приложению</a>
  </div>
  <div id="stats" class="stats"></div>
  <div id="out"></div>
</div>
<script>
const API='';
let timer=null;
function getCode(){
  const c=new URLSearchParams(location.search).get('c');
  return c?c.trim():'';
}
function parseUA(ua){
  let browser='?',os='?';
  if(/Edg\//.test(ua)) browser='Edge'; else if(/OPR\/|Opera/.test(ua)) browser='Opera';
  else if(/Chrome\//.test(ua)) browser='Chrome'; else if(/Firefox\//.test(ua)) browser='Firefox';
  else if(/Safari\//.test(ua)) browser='Safari';
  if(/Windows NT 10/.test(ua)) os='Windows'; else if(/Windows/.test(ua)) os='Windows';
  else if(/iPhone/.test(ua)) os='iOS'; else if(/iPad/.test(ua)) os='iPadOS';
  else if(/Android/.test(ua)) os='Android'; else if(/Mac OS X/.test(ua)) os='macOS';
  else if(/Linux/.test(ua)) os='Linux';
  let dev='Desktop'; if(/Mobi|Android|iPhone|iPad/.test(ua)) dev='Mobile';
  return {browser,os,dev};
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
async function load(){
  const code=getCode();
  const out=document.getElementById('out'); const stats=document.getElementById('stats');
  if(!code){ out.innerHTML='<div class="err">Код не указан в URL.<br>Открой: <b>admin.html?c=ТВОЙ_КОД</b></div>'; return; }
  out.innerHTML='<div class="empty">загрузка…</div>'; stats.innerHTML='';
  try{
    const r=await fetch(API+'/admin/'+encodeURIComponent(code));
    if(!r.ok){ out.innerHTML='<div class="err">Ошибка '+r.status+(r.status===403?' — неверный код':(r.status===429?' — лимит':''))+'</div>'; return; }
    const logs=await r.json();
    if(!Array.isArray(logs)||!logs.length){ out.innerHTML='<div class="empty">пока нет посетителей. Открой приложение через прокси — данные появятся здесь.</div>'; return; }
    logs.reverse();
    const ips=new Set(logs.map(l=>l.ip).filter(Boolean));
    stats.innerHTML=
      '<div class="stat"><b>'+logs.length+'</b><span>всего визитов</span></div>'+
      '<div class="stat"><b>'+ips.size+'</b><span>уникальных IP</span></div>'+
      '<div class="stat"><b>'+new Set(logs.map(l=>l.country).filter(Boolean)).size+'</b><span>стран</span></div>';
    let rows='';
    for(const l of logs){
      const u=parseUA(l.ua);
      const t=l.time?new Date(l.time).toLocaleString('ru-RU'):'';
      rows+='<tr>'+
        '<td>'+esc(t)+'</td>'+
        '<td class="ip">'+esc(l.ip||'?')+'</td>'+
        '<td>'+esc(l.country||'?')+'</td>'+
        '<td>'+esc(l.asn||'?')+'</td>'+
        '<td>'+u.browser+'<div class="ua">'+u.os+' · '+u.dev+'</div></td>'+
        '<td class="ua">'+esc(l.ua||'?')+'</td>'+
        '<td class="ua">'+esc(l.ref||'—')+'</td>'+
      '</tr>';
    }
    out.innerHTML='<table><thead><tr><th>Время</th><th>IP</th><th>Страна</th><th>Провайдер/ASN</th><th>Браузер</th><th>User-Agent</th><th>Откуда</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }catch(e){ out.innerHTML='<div class="err">Сетевая ошибка: '+esc(e.message)+'<br>Возможно, воркер недоступен или CORS.</div>'; }
}
document.getElementById('load').onclick=load;
document.getElementById('refresh').onclick=function(){
  if(timer){ clearInterval(timer); timer=null; this.textContent='Авто 15с'; return; }
  load(); timer=setInterval(load,15000); this.textContent='Стоп авто';
};
load();
</script>
</body>
</html>
